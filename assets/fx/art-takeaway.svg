<svg xmlns="http://www.w3.org/2000/svg" width="600" height="205" viewBox="0 0 600 205" role="img" aria-label="Illustration: printing receipt and order status">
<style>text{font-family:'Courier New', Courier, 'DejaVu Sans Mono', 'Liberation Mono', monospace}.band{animation:bnd 7s linear infinite}@keyframes bnd{from{transform:translateY(-60px)}to{transform:translateY(225px)}}.bk{animation:bk 1.2s steps(1) infinite}@keyframes bk{0%,55%{opacity:1}56%,100%{opacity:0}}.cl{opacity:0;animation:cl 8s steps(1) infinite both}@keyframes cl{0%{opacity:0}4%,90%{opacity:1}94%,100%{opacity:0}}.pp{opacity:0;animation:pp 4.8s steps(1) infinite}@keyframes pp{0%{opacity:0}1%,33%{opacity:1}34%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000" opacity=".28"/></pattern><linearGradient id="bandg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/></radialGradient><clipPath id="rc"><rect x="-4" y="0" width="230" height="0"><animate attributeName="height" values="0;190;190;0" keyTimes="0;.35;.92;1" dur="8s" repeatCount="indefinite"/></rect></clipPath></defs>
<g><rect width="600" height="205" fill="#0c0909"/><rect x="290" y="52" width="280" height="92" fill="#0a0e0c" stroke="#2a2222"/><text x="290" y="44" font-size="9" letter-spacing="3" fill="#5f564c">TRANSACTION-SAFE ORDER FLOW</text><g class="cl" style="animation-delay:0.0s"><text x="300" y="74" font-size="12.5" fill="#8fb89a">BEGIN;</text></g><g class="cl" style="animation-delay:0.9s"><text x="300" y="94" font-size="12.5" fill="#d8d0bd">INSERT INTO orders ...;</text></g><g class="cl" style="animation-delay:1.8s"><text x="300" y="114" font-size="12.5" fill="#d8d0bd">INSERT INTO order_items ...;</text></g><g class="cl" style="animation-delay:2.7s"><text x="300" y="134" font-size="12.5" fill="#8fb89a">COMMIT;</text></g><path d="M306 166H506" stroke="#2a2222" stroke-width="2"/><circle cx="306" cy="166" r="6" fill="#241c1a" stroke="#2a2222"/><circle cx="306" cy="166" r="6" fill="#d23a32" class="pp" style="animation-delay:0.0s"/><text x="306" y="190" font-size="9" letter-spacing="1" fill="#5f564c" text-anchor="middle">PLACED</text><circle cx="406" cy="166" r="6" fill="#241c1a" stroke="#2a2222"/><circle cx="406" cy="166" r="6" fill="#d23a32" class="pp" style="animation-delay:1.6s"/><text x="406" y="190" font-size="9" letter-spacing="1" fill="#5f564c" text-anchor="middle">PREPARING</text><circle cx="506" cy="166" r="6" fill="#241c1a" stroke="#2a2222"/><circle cx="506" cy="166" r="6" fill="#d23a32" class="pp" style="animation-delay:3.2s"/><text x="506" y="190" font-size="9" letter-spacing="1" fill="#5f564c" text-anchor="middle">DELIVERED</text><g transform="translate(40,40) scale(.82)"><g clip-path="url(#rc)"><path d="M0 0H220V176 l-10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 -10 -7 -10 7 H0Z" fill="#d6ccb2"/><text x="110" y="24" font-size="13" font-weight="bold" fill="#1c1612" text-anchor="middle" letter-spacing="4">TAKEAWAY</text><text x="110" y="38" font-size="9" fill="#5a4e3c" text-anchor="middle" letter-spacing="2">ORDER #0042 // SAMPLE</text><path d="M10 46H210" stroke="#5a4e3c" stroke-dasharray="3 3"/><g transform="translate(-36,-18)"><text x="46" y="74" font-size="11" fill="#2a221c">BURGER x2</text><text x="196" y="74" font-size="11" fill="#2a221c" text-anchor="end">840</text><text x="46" y="90" font-size="11" fill="#2a221c">FRIES</text><text x="196" y="90" font-size="11" fill="#2a221c" text-anchor="end">220</text><text x="46" y="106" font-size="11" fill="#2a221c">COLA x2</text><text x="196" y="106" font-size="11" fill="#2a221c" text-anchor="end">260</text></g><path d="M10 116H210" stroke="#5a4e3c" stroke-dasharray="3 3"/><text x="10" y="136" font-size="12" font-weight="bold" fill="#1c1612">TOTAL</text><text x="210" y="136" font-size="12" font-weight="bold" fill="#1c1612" text-anchor="end">1320</text><g transform="rotate(-9 150 150)"><rect x="106" y="142" width="96" height="22" fill="none" stroke="#a3201f" stroke-width="2"/><text x="154" y="158" font-size="13" font-weight="bold" letter-spacing="3" fill="#a3201f" text-anchor="middle">PAID</text></g></g></g></g><rect class="band" width="600" height="40" fill="url(#bandg)"/><rect width="600" height="205" fill="url(#scan)" opacity=".7"/><rect width="600" height="205" fill="url(#vig)"/>
</svg>
